<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Library of Italian History</title>
    <style>
        /* Reset e Base */
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Georgia', serif; background-color: #000; color: #fff; overflow: hidden; }
        
        /* Gestione Schermate */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: cover; background-position: center; background-repeat: no-repeat; flex-direction: column; align-items: center; justify-content: center; }
        .active { display: flex; }
        
        /* Assegnazione Sfondi Corretti */
        #intro-screen { background-image: url('Intro.png'); }
        #home-screen { background-image: url('Home.png'); }
        #enter-screen { background-image: url('Enter.png'); }
        
        /* Sfondo Schermata Categoria (Forzato) */
        #category-screen { background-color: #1a1a1a; background-size: cover; background-position: center; background-repeat: no-repeat; }
        
        /* Elementi UI */
        .top-bar { position: absolute; top: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; }
        .icon-btn { background: rgba(0,0,0,0.7); color: #d4af37; border: 1px solid #d4af37; border-radius: 8px; padding: 10px 15px; font-size: 1rem; cursor: pointer; text-transform: uppercase; font-family: 'Georgia', serif; }
        .main-btn { padding: 15px 40px; font-size: 1.5rem; background: rgba(0,0,0,0.8); color: #d4af37; border: 2px solid #d4af37; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-family: 'Georgia', serif; margin: 0 10px; transition: transform 0.2s; }
        .main-btn:active { transform: scale(0.95); }
        #lang-toggle { position: absolute; top: 20px; right: 20px; z-index: 15; }

        /* Contenitore Pulsanti Enter Screen (2 SOPRA, 1 CENTRATO SOTTO) */
        .category-container { 
            display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; 
            width: 90%; max-width: 450px; margin-top: 80px; margin-bottom: 20px; 
            overflow-y: auto; max-height: 80vh; padding: 10px; 
        }
        .cat-btn { 
            width: calc(50% - 10px); aspect-ratio: 9 / 16; object-fit: cover; 
            cursor: pointer; border-radius: 15px; border: 2px solid #d4af37; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.9); transition: transform 0.2s;
        }
        .cat-btn:active { transform: scale(0.95); }

        /* Griglia Volumi */
        .search-container { margin-top: 80px; margin-bottom: 10px; display: flex; gap: 10px; width: 90%; max-width: 400px; }
        .search-container input { flex-grow: 1; padding: 10px; border-radius: 5px; border: 1px solid #d4af37; background: rgba(0,0,0,0.8); color: white; font-family: 'Georgia', serif; }
        
        .grid-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 90%; max-width: 500px; margin-top: 10px; margin-bottom: auto; }
        .volume-card { position: relative; background: rgba(0,0,0,0.9); border: 2px solid #d4af37; border-radius: 10px; text-align: center; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; aspect-ratio: 9 / 16; box-shadow: 0 4px 10px rgba(0,0,0,0.8); }
        .volume-card img { width: 100%; height: 100%; object-fit: cover; display: block; }
        
        .pagination { display: flex; justify-content: center; gap: 20px; margin-bottom: 30px; width: 100%; }

        /* Schermata Singolo Volume */
        #volume-screen { background-color: #1a1a1a; background-image: none; }
        .vol-large-img { width: 45%; max-width: 200px; aspect-ratio: 9 / 16; border: 3px solid #d4af37; border-radius: 10px; margin-top: 70px; margin-bottom: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.9); background-color: #222; background-size: cover; background-position: center; }
        .vol-title-text { font-size: 1.6rem; text-align: center; color: #d4af37; margin-bottom: 15px; padding: 0 15px; text-shadow: 1px 1px 3px black; }
        
        .chapter-list { width: 90%; max-width: 400px; overflow-y: auto; max-height: 40vh; display: flex; flex-direction: column; gap: 10px; padding-bottom: 20px; }
        .chapter-btn { width: 100%; padding: 15px; background: rgba(212, 175, 55, 0.2); color: #fff; border: 1px solid #d4af37; border-radius: 8px; cursor: pointer; font-family: 'Georgia', serif; font-size: 1.1rem; transition: background 0.3s; text-align: left; }
        .chapter-btn.playing { background: rgba(212, 175, 55, 0.7); font-weight: bold; }
        .chapter-btn:active { background: rgba(212, 175, 55, 0.5); }
    </style>
</head>
<body>

    <audio id="bg-music" src="Home.mp3" loop></audio>
    <audio id="narrator-audio"></audio>

    <div id="intro-screen" class="screen active"></div>

    <div id="home-screen" class="screen">
        <button id="lang-toggle" class="icon-btn" onclick="toggleLanguage()">ITA / ENG</button>
        <div style="margin-top: auto; margin-bottom: 10vh; display: flex; justify-content: center; gap: 20px; width: 100%;">
            <button class="main-btn" onclick="goToScreen('enter-screen')" data-i18n="enter">Enter</button>
            <button class="main-btn" onclick="exitApp()" data-i18n="exit">Exit</button>
        </div>
    </div>

    <div id="enter-screen" class="screen">
        <div class="top-bar">
            <button class="icon-btn" onclick="goToScreen('home-screen')" data-i18n="back">Back</button>
            <button class="icon-btn music-toggle" onclick="toggleMusic()">Music: ON</button>
        </div>
        <div class="category-container">
            <img src="HF.png" class="cat-btn" alt="Historical Figures" onclick="openCategory('HF')">
            <img src="HT.png" class="cat-btn" alt="History of the Towns" onclick="openCategory('HT')">
            <img src="FB.png" class="cat-btn" alt="Folk Beliefs" onclick="openCategory('FB')">
        </div>
    </div>

    <div id="category-screen" class="screen">
        <div class="top-bar">
            <button class="icon-btn" onclick="goToScreen('enter-screen')" data-i18n="back">Back</button>
            <button class="icon-btn music-toggle" onclick="toggleMusic()">Music: ON</button>
        </div>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search volumes by title..." data-i18n-ph="search-ph">
            <button class="icon-btn" onclick="searchVolumes()" data-i18n="search-btn">Search</button>
        </div>
        
        <div id="volume-grid" class="grid-container"></div>
        
        <div class="pagination">
            <button class="icon-btn" onclick="changePage(-1)" id="btn-prev">&#8592; Prev Page</button>
            <button class="icon-btn" onclick="changePage(1)" id="btn-next">Next Page &#8594;</button>
        </div>
    </div>

    <div id="volume-screen" class="screen">
        <div class="top-bar">
            <button class="icon-btn" onclick="goToScreen('category-screen')" data-i18n="back">Back</button>
            <button class="icon-btn music-toggle" onclick="toggleMusic()">Music: ON</button>
        </div>
        
        <div id="vol-cover" class="vol-large-img"></div>
        <div class="vol-title-text" id="vol-title">Volume Title</div>
        
        <div id="chapter-list" class="chapter-list"></div>
    </div>

    <script>
        let autoPlayTimeout = null;
        let currentChapterIndex = 0;
        let isMusicPlaying = true;
        let currentLang = 'en'; 
        let currentCategory = '';
        let currentPage = 0;
        let filteredVolumes = [];
        let currentActiveVolume = null;

        const bgMusic = document.getElementById('bg-music');
        const narratorAudio = document.getElementById('narrator-audio');
        
        const dictionary = {
            'en': {
                'enter': 'Enter', 'exit': 'Exit', 'back': 'Back',
                'music-on': 'Music: ON', 'music-off': 'Music: OFF',
                'search-ph': 'Search volumes by title...', 'search-btn': 'Search',
                'prev': '&#8592; Prev Page', 'next': 'Next Page &#8594;',
                'no-chap': 'Chapters coming soon...', 'play-chap': '▶ Chapter ',
                'alert-exit': 'App is in Web version. Close the browser tab to exit.'
            },
            'it': {
                'enter': 'Entra', 'exit': 'Esci', 'back': 'Indietro',
                'music-on': 'Musica: ON', 'music-off': 'Musica: OFF',
                'search-ph': 'Cerca volumi per titolo...', 'search-btn': 'Cerca',
                'prev': '&#8592; Pag Precedente', 'next': 'Pag Successiva &#8594;',
                'no-chap': 'Capitoli in arrivo...', 'play-chap': '▶ Capitolo ',
                'alert-exit': "L'app è in versione Web. Chiudi la scheda del browser per uscire."
            }
        };

        const database = {
            'HF': [
                { id: 1, title: 'Alfonso I d\'Este', chapterCount: 6 },
                { id: 2, title: 'Giulio Cesare', chapterCount: 12 },
                { id: 3, title: 'Marco Polo', chapterCount: 0 },
                { id: 4, title: 'Cristoforo Colombo', chapterCount: 0 },
                { id: 5, title: 'Lorenzo De Medici', chapterCount: 0 }
            ],
            'HT': [
                { id: 1, title: 'Ferrara', chapterCount: 6 },
                { id: 2, title: 'Roma Antica', chapterCount: 12 },
                { id: 3, title: 'Firenze', chapterCount: 0 },
                { id: 4, title: 'Venezia', chapterCount: 0 }
            ],
            'FB': [
                { id: 1, title: 'Spettri e Misteri Estensi', chapterCount: 7 },
                { id: 2, title: 'Castello di Azzurrina', chapterCount: 0 },
                { id: 3, title: 'Lupo Mannaro', chapterCount: 0 },
                { id: 4, title: 'Streghe di Benevento', chapterCount: 0 }
            ]
        };

        const categoryBackgrounds = {
            'HF': 'LibrarHF.png', 
            'HT': 'LibrarHT.png', 
            'FB': 'LibraryFB.png'
        };

        function toggleLanguage() {
            currentLang = (currentLang === 'en') ? 'it' : 'en';
            const elements = document.querySelectorAll('[data-i18n]');
            for (let i = 0; i < elements.length; i++) {
                const key = elements[i].getAttribute('data-i18n');
                elements[i].innerText = dictionary[currentLang][key];
            }
            document.getElementById('searchInput').placeholder = dictionary[currentLang]['search-ph'];
            updateMusicButtonsText();
            document.getElementById('btn-prev').innerHTML = dictionary[currentLang]['prev'];
            document.getElementById('btn-next').innerHTML = dictionary[currentLang]['next'];
            
            if(document.getElementById('volume-screen').classList.contains('active')) {
                if (currentActiveVolume !== null) { openVolume(currentActiveVolume, false); }
            }
        }

        function goToScreen(screenId) {
            if (autoPlayTimeout !== null) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }
            narratorAudio.pause(); 
            bgMusic.volume = 1.0; 
            
            const screens = document.querySelectorAll('.screen');
            for (let i = 0; i < screens.length; i++) { screens[i].classList.remove('active'); }
            document.getElementById(screenId).classList.add('active');
            
            if (screenId === 'home-screen' && isMusicPlaying) {
                bgMusic.play().catch(function(e){ console.log("Autoplay bloccato"); });
            }
        }

        function exitApp() { alert(dictionary[currentLang]['alert-exit']); }

        setTimeout(function() {
            if(document.getElementById('intro-screen').classList.contains('active')) { goToScreen('home-screen'); }
        }, 5000);

        function updateMusicButtonsText() {
            const btns = document.querySelectorAll('.music-toggle');
            for (let i = 0; i < btns.length; i++) {
                btns[i].innerText = isMusicPlaying ? dictionary[currentLang]['music-on'] : dictionary[currentLang]['music-off'];
            }
        }

        function toggleMusic() {
            isMusicPlaying = !isMusicPlaying;
            updateMusicButtonsText();
            if (isMusicPlaying) { bgMusic.play(); } else { bgMusic.pause(); }
        }

        narratorAudio.addEventListener('ended', function() {
            if (currentActiveVolume !== null && currentChapterIndex + 1 < currentActiveVolume.chapters.length) {
                playChapter(currentChapterIndex + 1);
            } else {
                bgMusic.volume = 1.0; 
            }
        });

        function openCategory(cat) {
            currentCategory = cat;
            currentPage = 0;
            
            const bgFileName = categoryBackgrounds[cat];
            const catScreen = document.getElementById('category-screen');
            catScreen.style.backgroundImage = "url('" + bgFileName + "')";
            
            let vols = [];
            if (database !== null && database !== undefined) {
                if (database[cat] !== null && database[cat] !== undefined) { vols = database[cat]; }
            }
            filteredVolumes = vols;
            
            document.getElementById('searchInput').value = ''; 
            renderGrid();
            goToScreen('category-screen');
        }

        function renderGrid() {
            const grid = document.getElementById('volume-grid');
            grid.innerHTML = '';
            const start = currentPage * 9;
            const end = start + 9;
            const pageItems = filteredVolumes.slice(start, end);
            
            for (let i = 0; i < pageItems.length; i++) {
                const vol = pageItems[i];
                const div = document.createElement('div');
                div.className = 'volume-card';
                div.onclick = (function(v) { return function() { openVolume(v, true); }; })(vol);
                
                const coverFileName = currentCategory + vol.id + '.png';
                div.innerHTML = "<img src='" + coverFileName + "' alt='" + vol.title + "' onerror=\"this.src='Intro.png';\">";
                grid.appendChild(div);
            }
        }

        function changePage(dir) {
            const maxPage = Math.ceil(filteredVolumes.length / 9) - 1;
            let newPage = currentPage + dir;
            if (newPage < 0) newPage = 0;
            if (newPage > maxPage) newPage = Math.max(0, maxPage);
            
            if (newPage !== currentPage) {
                currentPage = newPage;
                renderGrid();
            }
        }

        function searchVolumes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let allCatVols = [];
            if (database !== null && database !== undefined) {
                if (database[currentCategory] !== null && database[currentCategory] !== undefined) { allCatVols = database[currentCategory]; }
            }
            filteredVolumes = [];
            for (let i = 0; i < allCatVols.length; i++) {
                if (allCatVols[i].title.toLowerCase().indexOf(query) !== -1) {
                    filteredVolumes.push(allCatVols[i]);
                }
            }
            currentPage = 0;
            renderGrid();
        }

        function openVolume(vol, shouldAutoPlay) {
            currentActiveVolume = vol;
            document.getElementById('vol-title').innerText = vol.title;
            
            const coverFileName = currentCategory + vol.id + '.png';
            const largeCover = document.getElementById('vol-cover');
            largeCover.style.backgroundImage = "url('" + coverFileName + "')";
            
            const tempImg = new Image();
            tempImg.src = coverFileName;
            tempImg.onerror = function() {
                largeCover.style.backgroundImage = "url('Intro.png')";
            };
            
            const list = document.getElementById('chapter-list');
            list.innerHTML = '';
            
            if (autoPlayTimeout !== null) {
                clearTimeout(autoPlayTimeout);
                autoPlayTimeout = null;
            }

            // CREAZIONE DINAMICA PERCORSO AUDIO (es: HT1_cap1.mp3)
            currentActiveVolume.chapters = [];
            for (let i = 1; i <= vol.chapterCount; i++) {
                currentActiveVolume.chapters.push(currentCategory + vol.id + '_cap' + i + '.mp3');
            }
            
            if (currentActiveVolume.chapters.length === 0) {
                list.innerHTML = "<div style='text-align:center; color:white;'>" + dictionary[currentLang]['no-chap'] + "</div>";
            } else {
                for (let i = 0; i < currentActiveVolume.chapters.length; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'chapter-btn';
                    btn.id = 'btn-cap-' + i; 
                    btn.innerText = dictionary[currentLang]['play-chap'] + (i + 1);
                    btn.onclick = (function(idx) { 
                        return function() { 
                            if(autoPlayTimeout !== null) clearTimeout(autoPlayTimeout);
                            playChapter(idx); 
                        }; 
                    })(i);
                    list.appendChild(btn);
                }
                
                if (shouldAutoPlay) {
                    autoPlayTimeout = setTimeout(function() {
                        playChapter(0);
                    }, 2000);
                }
            }
            goToScreen('volume-screen');
        }

        function playChapter(index) {
            if (currentActiveVolume === null) return;
            if (index >= currentActiveVolume.chapters.length) return;
            
            currentChapterIndex = index;
            const audioSrc = currentActiveVolume.chapters[index];
            
            if (isMusicPlaying) {
                bgMusic.volume = 0.15;
            }
            
            const allBtns = document.querySelectorAll('.chapter-btn');
            for (let i = 0; i < allBtns.length; i++) { allBtns[i].classList.remove('playing'); }
            
            const activeBtn = document.getElementById('btn-cap-' + index);
            if (activeBtn !== null) activeBtn.classList.add('playing');

            narratorAudio.src = audioSrc;
            narratorAudio.play().catch(function(e) {
                alert("File audio (" + audioSrc + ") non trovato su GitHub. Se lo hai caricato ora, attendi 2 minuti che i server di GitHub lo rendano pubblico!");
            });
        }
    </script>
</body>
</html>
